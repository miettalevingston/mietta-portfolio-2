<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Project - Mietta Levingston</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <div class="brand">
      <span class="name">Mietta Levingston</span>
      <span class="role">Final Year Mechanical Engineering (Honours) & Arts (Economics) Student</span>
    </div>
    <nav class="links">
      <a href="index.html#work">Work</a>
    </nav>
  </div>
</header>

<div class="wrap">
  <div class="detail-hero">
    <a class="back-link" href="index.html">← Back to all projects</a>
    <div id="detail-content"></div>
  </div>

  <div id="gallery-content"></div>

  <div class="detail-body">
    <div class="prose" id="prose-content"></div>
    <div class="spec-table" id="spec-content"></div>
  </div>
</div>

<div id="next-content"></div>

<footer>
  <div class="wrap" style="display:flex; justify-content:space-between; width:100%; flex-wrap:wrap; gap:12px;">
    <span>© <span id="year"></span> Mietta Levingston</span>
    <span>
      <a href="mailto:you@email.com">you@email.com</a> ·
      <a href="https://github.com/yourname" target="_blank" rel="noopener">GitHub</a> ·
      <a href="https://linkedin.com/in/yourname" target="_blank" rel="noopener">LinkedIn</a>
    </span>
  </div>
</footer>

<script src="projects.js"></script>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const project = PROJECTS.find(p => p.id === id) || PROJECTS[0];
  const index = PROJECTS.findIndex(p => p.id === project.id);
  const next = PROJECTS[(index + 1) % PROJECTS.length];

  document.title = `${project.title} - Mietta Levingston`;

  document.getElementById('detail-content').innerHTML = `
    <div class="cat">${project.category || 'Engineering'}</div>
    <h1>${project.title}</h1>
    <p class="tagline">${project.tagline}</p>
    <div class="meta-strip">
      <div class="item"><div class="k">Year</div><div class="v">${project.year}</div></div>
      <div class="item"><div class="k">Role</div><div class="v">${project.role}</div></div>
      <div class="item"><div class="k">Stack</div><div class="v">${project.stack.join(', ')}</div></div>
    </div>
  `;

  // ---------- reusable carousel builder ----------
  // Returns HTML for a carousel with a unique id, and registers an init
  // function to run after the HTML is inserted into the DOM.
  const pendingCarousels = [];

  function carouselHTML(images, uid) {
    const imgs = images && images.length ? images : [null];
    pendingCarousels.push({ uid, count: imgs.length });
    return `
      <div class="carousel" id="${uid}">
        <div class="carousel-track" id="${uid}-track">
          ${imgs.map(img => `
            <div class="carousel-slide">
              ${img
                ? `<img src="${img}" alt="${project.title}" loading="lazy" />`
                : `<div class="placeholder-grid">ADD PROJECT PHOTOS →</div>`}
            </div>
          `).join('')}
        </div>
        ${imgs.length > 1 ? `
          <button class="carousel-btn prev" data-uid="${uid}" aria-label="Previous photo">‹</button>
          <button class="carousel-btn next" data-uid="${uid}" aria-label="Next photo">›</button>
          <div class="carousel-dots" id="${uid}-dots">
            ${imgs.map((_, i) => `<button class="dot${i === 0 ? ' active' : ''}" data-index="${i}" aria-label="Go to photo ${i + 1}"></button>`).join('')}
          </div>
        ` : ''}
      </div>
    `;
  }

  function initCarousels() {
    pendingCarousels.forEach(({ uid, count }) => {
      if (count <= 1) return;
      const el = document.getElementById(uid);
      if (!el) return;
      const track = document.getElementById(`${uid}-track`);
      const dots = Array.from(document.querySelectorAll(`#${uid}-dots .dot`));
      let current = 0;

      function goTo(i) {
        current = (i + count) % count;
        track.style.transform = `translateX(-${current * 100}%)`;
        dots.forEach((d, idx) => d.classList.toggle('active', idx === current));
      }

      el.querySelector('.carousel-btn.prev').addEventListener('click', () => goTo(current - 1));
      el.querySelector('.carousel-btn.next').addEventListener('click', () => goTo(current + 1));
      dots.forEach(d => d.addEventListener('click', () => goTo(Number(d.dataset.index))));

      let startX = null;
      el.addEventListener('touchstart', e => { startX = e.touches[0].clientX; });
      el.addEventListener('touchend', e => {
        if (startX === null) return;
        const dx = e.changedTouches[0].clientX - startX;
        if (dx > 40) goTo(current - 1);
        else if (dx < -40) goTo(current + 1);
        startX = null;
      });
    });
    pendingCarousels.length = 0;
  }

  function proseBlock(p, idPrefix) {
    idPrefix = idPrefix || 'main';
    return `
      <h2>${p.overviewLabel || 'Overview'}</h2>
      <p>${p.overview}</p>
      <h2>${p.problemLabel || 'Problem'}</h2>
      <p>${p.problem}</p>
      ${p.steps ? `
        <h2>${p.approachLabel || 'Approach'}</h2>
        <ol class="step-list">
          ${p.steps.map((s, i) => `
            <li class="step-item">
              <div class="step-num">${String(i + 1).padStart(2, '0')}</div>
              <div class="step-body">
                <div class="step-title">${s.title}</div>
                <div class="step-desc">${s.desc}</div>
              </div>
            </li>
          `).join('')}
        </ol>
      ` : `
        <h2>${p.approachLabel || 'Approach'}</h2>
        <p>${p.approach}</p>
      `}
      ${p.approachGallery ? `
        ${p.approachGallery.label ? `<div class="image-group-label">${p.approachGallery.label}</div>` : ''}
        ${carouselHTML(p.approachGallery.images, `${idPrefix}-approach-carousel`)}
      ` : ''}
      <h2>${p.resultsLabel || 'Results'}</h2>
      <p>${p.results}</p>
      ${p.resultsGallery ? `
        ${p.resultsGallery.label ? `<div class="image-group-label">${p.resultsGallery.label}</div>` : ''}
        ${carouselHTML(p.resultsGallery.images, `${idPrefix}-results-carousel`)}
      ` : ''}
      ${p.futureWork ? `
        <h2>Future Work</h2>
        <ul class="future-list">
          ${p.futureWork.map(item => `<li>${item}</li>`).join('')}
        </ul>
      ` : ''}
      ${p.pdfEmbed ? `
        <h2>${p.pdfEmbed.label}</h2>
        <div class="pdf-embed">
          <iframe src="${p.pdfEmbed.path}" title="${p.pdfEmbed.label}"></iframe>
        </div>
        <p class="pdf-fallback">Can't see the embed? <a href="${p.pdfEmbed.path}" target="_blank" rel="noopener">Open the PDF directly →</a></p>
      ` : ''}
      ${p.conferences ? `
        <h2>Conferences</h2>
        <div class="conf-table">
          ${p.conferences.map(c => `
            <div class="conf-row">
              <div class="conf-event">${c.event}</div>
              <div class="conf-details">
                <div class="conf-full">${c.full}</div>
                <div class="conf-meta">${[c.location, c.date].filter(Boolean).join(' · ')}</div>
              </div>
            </div>
          `).join('')}
        </div>
      ` : ''}
      ${p.publication ? `
        <h2>Publication</h2>
        <p>${p.publication}</p>
      ` : ''}
    `;
  }

  function statBadges(stats) {
    if (!stats || !stats.length) return '';
    return `
      <div class="stat-badges">
        ${stats.map(s => `
          <div class="stat-badge">
            <div class="num">${s.v}</div>
            <div class="label">${s.k}</div>
          </div>
        `).join('')}
      </div>
    `;
  }

  // ================= RENDER MODES =================

  if (project.yearTabs && project.yearTabs.length) {
    // ---- Multi-year, tab-switchable project ----
    let activeTab = 0;

    function renderTab(i) {
      activeTab = i;
      const tab = project.yearTabs[i];

      document.getElementById('year-tabs').innerHTML = project.yearTabs.map((t, idx) => `
        <button class="year-tab-btn${idx === activeTab ? ' active' : ''}" data-idx="${idx}">${t.label}</button>
      `).join('');

      document.getElementById('gallery-content').innerHTML = `
        <div class="wrap">
          ${statBadges(tab.badgeStats)}
          ${carouselHTML(tab.images, `carousel-${i}`)}
        </div>
      `;

      document.getElementById('prose-content').innerHTML = `
        ${tab.role ? `<div class="role-chip">${tab.role}</div>` : ''}
        ${proseBlock(tab, `tab-${i}`)}
      `;

      initCarousels();

      document.querySelectorAll('.year-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => renderTab(Number(btn.dataset.idx)));
      });
    }

    document.getElementById('gallery-content').insertAdjacentHTML(
      'beforebegin',
      `<div class="wrap"><div class="year-tabs" id="year-tabs"></div></div>`
    );

    renderTab(0);

  } else if (project.imageGroups && project.imageGroups.length) {
    // ---- Single-narrative project with multiple labeled carousels ----
    document.getElementById('gallery-content').innerHTML = `
      <div class="wrap">
        ${project.imageGroups.map((g, i) => `
          <div class="image-group-label">${g.label}</div>
          ${carouselHTML(g.images, `carousel-g${i}`)}
        `).join('')}
      </div>
    `;
    initCarousels();
    document.getElementById('prose-content').innerHTML = proseBlock(project);

  } else {
    // ---- Standard single-narrative project ----
    if (!project.noGallery) {
      document.getElementById('gallery-content').innerHTML = `
        <div class="wrap">${carouselHTML(project.images, 'carousel-main')}</div>
      `;
      initCarousels();
    }
    document.getElementById('prose-content').innerHTML = proseBlock(project);
  }

  const linkRows = [];
  if (project.links?.github) linkRows.push(`<a href="${project.links.github}" target="_blank" rel="noopener">View source →</a>`);
  if (project.links?.demo) linkRows.push(`<a href="${project.links.demo}" target="_blank" rel="noopener">Live demo →</a>`);
  if (project.externalLinks) {
    project.externalLinks.forEach(l => {
      linkRows.push(`<a href="${l.url}" target="_blank" rel="noopener">${l.label} →</a>`);
    });
  }

  document.getElementById('spec-content').innerHTML = `
    ${project.specs.map(s => `
      <div class="row"><span class="k">${s.k}</span><span class="v">${s.v}</span></div>
    `).join('')}
    ${linkRows.length ? `<div class="links">${linkRows.join('')}</div>` : ''}
  `;

  document.getElementById('next-content').innerHTML = `
    <div class="wrap">
      <div class="next-project">
        <div>
          <div class="label">Next project</div>
          <a href="project.html?id=${encodeURIComponent(next.id)}"><h3>${next.title} →</h3></a>
        </div>
      </div>
    </div>
  `;

  // ---------- optional bottom sections: slides gallery + downloadable PDF ----------
  if (project.slidesGallery || project.bottomPdf) {
    let bottomHTML = '<div class="wrap"><div class="bottom-extras">';

    if (project.slidesGallery) {
      bottomHTML += `
        <div class="section-label"><span class="tag">${project.slidesGallery.label}</span></div>
        ${carouselHTML(project.slidesGallery.images, 'carousel-slides')}
        <p class="extras-caption">${project.slidesGallery.caption}</p>
      `;
    }

    if (project.bottomPdf) {
      bottomHTML += `
        <div class="section-label"><span class="tag">${project.bottomPdf.label}</span></div>
        <div class="pdf-embed">
          <iframe src="${project.bottomPdf.path}" title="${project.bottomPdf.label}"></iframe>
        </div>
        <p class="extras-caption">${project.bottomPdf.caption}</p>
        <p class="pdf-fallback"><a href="${project.bottomPdf.path}" target="_blank" rel="noopener">Open the PDF directly →</a></p>
      `;
    }

    bottomHTML += '</div></div>';
    document.getElementById('next-content').insertAdjacentHTML('beforebegin', bottomHTML);
    initCarousels();
  }
</script>

</body>
</html>
